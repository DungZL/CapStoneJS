<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberPhone - Cửa hàng</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Main CSS -->
  <link rel="stylesheet" href="./asset/css/main.css">
</head>
<body>
  <!-- Header -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">CyberPhone</a>
      <div>
        <a href="./admin/view/admin.html" class="btn btn-outline-light me-3">Chuyển sang Admin</a>
        <button class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#cartModal">
          <i class="fa fa-shopping-cart"></i> Giỏ hàng (<span id="cartCount">0</span>)
        </button>
      </div>
    </div>
  </nav>

  <!-- Filter -->
  <div class="container mt-4">
    <div class="w-25">
      <label class="form-label fw-bold">Lọc sản phẩm:</label>
      <select id="selectFilter" class="form-select" onchange="filterProduct()">
        <option value="all">Tất cả</option>
        <option value="samsung">Samsung</option>
        <option value="iphone">iPhone</option>
      </select>
    </div>
  </div>

  <!-- Product List -->
  <div class="container mt-4">
    <div class="row" id="productList">
      <!-- Render nội dung tại đây -->
    </div>
  </div>

  <!-- Modal Giỏ Hàng -->
  <div class="modal fade" id="cartModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Giỏ Hàng Của Bạn</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <table class="table">
            <thead>
              <tr>
                <th>Hình ảnh</th>
                <th>Sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
                <th>Tổng</th>
                <th>Hành động</th>
              </tr>
            </thead>
            <tbody id="cartList"></tbody>
          </table>
          <h4 class="text-end text-danger mt-3">Tổng tiền: $<span id="totalPrice">0</span></h4>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
          <button class="btn btn-success" onclick="checkout()">Thanh toán</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Thư viện -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Các file JS Khách hàng -->
  <script src="./customer/model/Product.js"></script>
  <script src="./customer/model/CartItem.js"></script>
  <script src="./customer/services/api.js"></script>
  <script src="./customer/controller/main.js"></script>
</body>
</html>
