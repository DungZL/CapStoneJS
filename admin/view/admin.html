<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Quản lý sản phẩm</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../asset/css/main.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-secondary">
    <div class="container">
      <a class="navbar-brand" href="#">Trang Quản Trị</a>
      <a href="../../index.html" class="btn btn-outline-light">Về Trang Mua Hàng</a>
    </div>
  </nav>

  <div class="container mt-4">
    <h2 class="mb-4">Quản lý sản phẩm</h2>
    <div class="row mb-3">
      <div class="col-4">
        <input type="text" id="txtSearch" class="form-control" placeholder="Tìm kiếm theo tên..." oninput="searchProduct()">
      </div>
      <div class="col-4">
        <select id="selSort" class="form-select" onchange="sortProduct()">
          <option value="">Sắp xếp theo giá</option>
          <option value="asc">Tăng dần</option>
          <option value="desc">Giảm dần</option>
        </select>
      </div>
    </div>
    
    <!-- (Form thêm/sửa, Table render tương tự file index HTML bình thường) -->
    <!-- Chú ý id table là "tblAdminProducts" -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../model/Product.js"></script>
  <script src="../services/api.js"></script>
  <script src="../controller/main.js"></script>
</body>
</html>
